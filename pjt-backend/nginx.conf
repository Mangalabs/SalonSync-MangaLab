server {
    listen 80;
    server_name api.salonsync.com.br;

    # Permite o desafio ACME do Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona todo o resto para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.salonsync.com.br;

    ssl_certificate /etc/letsencrypt/live/api.salonsync.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.salonsync.com.br/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}