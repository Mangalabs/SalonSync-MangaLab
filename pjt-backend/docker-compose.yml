version: '3.8'

services:
  postgres:
    image: postgres:17.5-bookworm
    ports:
      - "5432:5432"
    container_name: salonSyncPostgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salonSync
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: 
      context: .
      network: host
    depends_on:
      - postgres
    command: npx prisma migrate dev
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/salonSync?schema=public

  app:
    build: 
      context: .
      network: host
    container_name: salonSyncAPI
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    command: npm start
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: salonSync
    restart: unless-stopped

  nginx:
    image: nginx:latest
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
        - ./nginx.conf:/etc/nginx/conf.d/default.conf
        - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  postgres_data:
