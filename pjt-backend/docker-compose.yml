version: '3.8'

services:
  postgres:
    image: postgres:17.5-bookworm
    container_name: salonSyncPostgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salonSync
    volumes:
      - postgres_data:/var/lib/postgresql/data
    network_mode: "host"

  migrate:
    build: .
    network_mode: "host"
    depends_on:
      - postgres
    command: npx prisma migrate dev
    environment:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/salonSync?schema=public

  app:
    build: .
    container_name: salonSyncAPI
    network_mode: "host"
    depends_on:
      - postgres
    command: npm start
    environment:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: salonSync
    restart: unless-stopped

  nginx:
    image: nginx:latest
    network_mode: "host"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./cert.pem:/etc/ssl/certs/cert.pem
      - ./privkey.pem:/etc/ssl/private/privkey.pem
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
